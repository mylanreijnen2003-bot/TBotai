name: backtest

# Handmatig starten: Actions -> backtest -> Run workflow
on:
  workflow_dispatch:

concurrency:
  group: backtest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Koersdata ophalen (alle EUR-markten)
        run: |
          set -o pipefail
          mkdir -p results
          python run.py download 2>&1 | tee -a results/run_log.txt

      - name: Backtest (0,30% en 0,60% kosten)
        run: |
          set -o pipefail
          mkdir -p results
          python run.py backtest 2>&1 | tee -a results/run_log.txt

      - name: 4-uurs data ophalen (BTC, ETH, SOL)
        run: |
          set -o pipefail
          mkdir -p results
          python run.py download4h 2>&1 | tee -a results/run_log.txt

      - name: Backtest 4-uurs spoor (0,15% / 0,30% / 0,60% kosten)
        run: |
          set -o pipefail
          mkdir -p results
          python run.py backtest4h 2>&1 | tee -a results/run_log.txt

      - name: Resultaten opslaan
        if: always()
        run: |
          git config user.name "tbotai-bot"
          git config user.email "tbotai-bot@users.noreply.github.com"
          git add results/
          git diff --cached --quiet && exit 0
          git commit -m "backtest $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

name: paper-run-4h

# Elke 4 uur, 7 minuten na het slot van een 4-uurs candle (UTC).
on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch:

concurrency:
  group: paper-run-4h
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Paper-run 4-uurs spoor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py live4h

      - name: Logboek opslaan
        if: always()
        run: |
          git config user.name "tbotai-bot"
          git config user.email "tbotai-bot@users.noreply.github.com"
          git add state_4h/ || true
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
            exit 0
          fi
          git commit -m "paper-run 4u $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 7
          done
          exit 1

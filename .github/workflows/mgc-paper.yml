name: mgc-paper

# Goud-bot (MGC): forward test op gratis Yahoo-koersen. Geen account, geen sleutels, geen orders.
# Elke werkdag om 19:23 UTC (na het goud-slot van 13:30 New York-tijd, ook in de winter).
# Gemiste dagen worden bij de volgende run ingehaald (zolang Yahoo de 1-minuutdata nog heeft: 30 dagen).
on:
  schedule:
    - cron: "23 19 * * 1-5"
  workflow_dispatch:
    inputs:
      datatest:
        description: "Alleen controleren of Yahoo data geeft (slaat niets op)"
        type: boolean
        default: false

concurrency:
  group: mgc-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: futures
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: futures/requirements.txt
      - run: pip install -r requirements.txt

      - name: Datatest
        if: ${{ inputs.datatest }}
        run: python -m bot_mgc.forward --datatest

      - name: Forward test (alle strategieën)
        if: ${{ !inputs.datatest }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot_mgc.forward

      - name: Resultaten opslaan
        if: ${{ always() && !inputs.datatest }}
        run: |
          git config user.name "tbotai-bot"
          git config user.email "tbotai-bot@users.noreply.github.com"
          git add mgc_paper/ || true
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
            exit 0
          fi
          git commit -m "mgc forward test $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 7
          done
          exit 1
